services:
  - type: web
    name: task-queue-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: task-queue-db
          property: connectionString
      - key: REDIS_URL
        value: redis://red-xxxxx.render.com:6379 # Replace with actual Redis URL

  - type: worker
    name: task-queue-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: task-queue-db
          property: connectionString
      - key: REDIS_URL
        value: redis://red-xxxxx.render.com:6379 # Replace with actual Redis URL

databases:
  - name: task-queue-db
    databaseName: task_queue
    user: task_queue_user
